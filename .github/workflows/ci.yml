name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Same as `npm run build`, plus the Cloudflare Workers bundle (catches adapter breakage before deploy).
      - run: npm run cf:build
      # Fails if most route pages came out with no fares (the same guard the Deploy workflow uses).
      - run: npm run verify:build
      # Blocking: anything that ships to the live site must have no high/critical advisories.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # Report-only: dev tools (linters, test runner) never reach users. Advisories with no
      # patched release yet shouldn't block deploys, but they stay visible in the log.
      - name: Audit dev tooling (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
