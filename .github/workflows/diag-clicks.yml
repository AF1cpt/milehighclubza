# Temporary: diagnoses why live clicks aren't reaching Supabase. Delete after use.
name: Diagnose click logging
on:
  push:
    branches: [claude/awesome-volta-vnxzr0]
    paths: [.github/workflows/diag-clicks.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SITE: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: Supabase secrets reach the REST API
        run: |
          node -e '
            const raw = process.env.SUPABASE_URL ?? "", key = process.env.SUPABASE_SERVICE_ROLE_KEY ?? "";
            console.log("SUPABASE_URL length", raw.length, "| trimmed differs:", raw !== raw.trim());
            let u; try { u = new URL(raw.trim()); } catch (e) { console.log("SUPABASE_URL is not a URL:", e.message); process.exit(0); }
            console.log("host:", u.host, "| path:", JSON.stringify(u.pathname), "| protocol:", u.protocol);
            console.log("key prefix:", key.slice(0, 10), "| length:", key.length, "| trimmed differs:", key !== key.trim());
            fetch(`${u.origin}/rest/v1/clicks?select=id&limit=1`, { headers: { apikey: key.trim(), Authorization: `Bearer ${key.trim()}` } })
              .then(async (r) => console.log("REST status:", r.status, "| body:", (await r.text()).slice(0, 200)))
              .catch((e) => console.log("REST fetch failed:", e.cause?.code ?? e.message));
          '
      - name: Live /go redirects and logs
        run: |
          curl -sS -o /dev/null -w 'GET /go -> HTTP %{http_code}\nLocation: %{redirect_url}\n' \
            "$SITE/go?p=aviasales&o=JNB&d=CPT&dep=2026-11-14&price=1&src=diag:ci"
